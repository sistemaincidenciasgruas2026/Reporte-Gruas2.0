function exportarExcelAbiertos() {

// Filtrar incidencias abiertas y en proceso
const pendientes = data.filter(r => {
  const estado = (r.estado || "").toLowerCase();

  return estado === "abierto" || estado === "proceso";
});

if (pendientes.length === 0) {
  alert("No hay incidencias abiertas o en proceso.");
  return;
}

  const excelData = [];

  // Encabezados
  excelData.push([
    "TICKET",
    "GRUA",
    "FALLA",
    "DESCRIPCION",
    "REPORTA",
    "ESTADO"
  ]);

  pendientes.forEach((r, index) => {

    excelData.push([
      `Ticket-${String(index + 1).padStart(3, "0")}`,
      r.grua || "",
      r.falla || "",
      r.descripcion || "",
      r.reporta || "",
      (r.estado || "").toUpperCase()
    ]);

  });

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(excelData);

  // Ancho columnas
  ws["!cols"] = [
    { wch: 15 }, // Ticket
    { wch: 15 }, // Grua
    { wch: 25 }, // Falla
    { wch: 60 }, // Descripcion
    { wch: 25 }, // Reporta
    { wch: 15 }  // Estado
  ];

  // Filtro
  ws["!autofilter"] = {
    ref: "A1:F" + excelData.length
  };

  // Congelar encabezado
  ws["!freeze"] = {
    xSplit: 0,
    ySplit: 1
  };

  // Estilo encabezados
  const headerStyle = {
    font: {
      bold: true,
      color: { rgb: "FFFFFF" },
      sz: 12
    },
    fill: {
      fgColor: { rgb: "1E40AF" }
    },
    alignment: {
      horizontal: "center",
      vertical: "center"
    },
    border: {
      top: { style: "thin" },
      bottom: { style: "thin" },
      left: { style: "thin" },
      right: { style: "thin" }
    }
  };

  // Aplicar estilo encabezados
  ["A1","B1","C1","D1","E1","F1"].forEach(cell => {
    if(ws[cell]) ws[cell].s = headerStyle;
  });

  // Estilo datos
  for(let row = 2; row <= excelData.length; row++) {

    ["A","B","C","D","E","F"].forEach(col => {

      const cell = ws[`${col}${row}`];

      if(cell) {

        cell.s = {
          alignment: {
            vertical: "top",
            wrapText: true
          },
          border: {
            top: { style: "thin", color:{rgb:"D1D5DB"} },
            bottom: { style: "thin", color:{rgb:"D1D5DB"} },
            left: { style: "thin", color:{rgb:"D1D5DB"} },
            right: { style: "thin", color:{rgb:"D1D5DB"} }
          }
        };

      }

    });

  }

  XLSX.utils.book_append_sheet(
    wb,
    ws,
    "Incidencias Pendientes"
  );

  const fecha = new Date().toISOString().split("T")[0];

  XLSX.writeFile(
    wb,
    `Incidencias_Pendientes_${fecha}.xlsx`
  );

}

/* SAVE */

async function save(){

  const tipoVal = document.getElementById("tipo").value;
  const gruaVal = document.getElementById("grua").value;
  let fallaVal = document.getElementById("falla").value;

if(fallaVal === "Otros"){
  fallaVal = document.getElementById("otraFalla").value;
}
  const descVal = document.getElementById("desc").value;
  const reportaVal = document.getElementById("reporta").value;
  const fechaVal = document.getElementById("fecha").value;
  const fileInput = document.getElementById("imgs");

  if(!gruaVal || !descVal){
    alert("❌ Falta grúa o descripción");
    return;
  }

  let images = [];

  for(let f of fileInput.files){

    const base64 = await new Promise(res=>{
      let r = new FileReader();
      r.onload = e => res(e.target.result);
      r.readAsDataURL(f);
    });

    images.push(base64);
  }

  const { error } = await supabaseClient
    .from("reclamos")
    .insert([{
      grua: gruaVal,
      falla: fallaVal,
      descripcion: descVal,
      fecha_reporte: fechaVal,
      fecha_atencion: null,
      nota: "",
      reporta: reportaVal,
      estado: "abierto",
      imagenes: images
    }]);

  if(error){
    console.error(error);
    alert("❌ Error: " + error.message);
    return;
  }

  limpiar();
  cargar();

  alert("Guardado correctamente");
}

async function guardarCierreConEvidencia(id){

  const input = document.getElementById("fotoEvidencia");

  if(!input.files[0]){
    alert("Falta evidencia");
    return;
  }

  const evidencia = await new Promise(res=>{
    const reader = new FileReader();
    reader.onload = e => res(e.target.result);
    reader.readAsDataURL(input.files[0]);
  });

  const { error } = await supabaseClient
    .from("reclamos")
    .update({
      estado: "cerrado",
      foto_evidencia: evidencia
    })
    .eq("id", id);

  if(error){
    alert(error.message);
    return;
  }

  document.getElementById("modalEvidencia").remove();
  cargar();
}

    alert(error.message);

  }

  cargar();
}

async function subirEvidencia(event, id){

  const file = event.target.files[0];

  if(!file) return;

  const base64 = await new Promise(res=>{
    const reader = new FileReader();

    reader.onload = e => res(e.target.result);

    reader.readAsDataURL(file);
  });

  // Obtener imágenes actuales
  const row = data.find(r => r.id === id);

  let imagenesActuales = row.imagenes || [];

  // Guardar evidencia adicional
  const { error } = await supabaseClient
    .from("reclamos")
    .update({
      imagenes: [...imagenesActuales, base64]
    })
    .eq("id", id);

  if(error){
    console.error(error);
    alert("Error al subir evidencia");
    return;
  }

  alert("Evidencia subida correctamente");

  cargar();

}

function abrirModalEvidenciaObligatoria(id, select, estadoAnterior){

  document.getElementById("modalEvidencia")?.remove();

  const modal = document.createElement("div");
  modal.id = "modalEvidencia";

  modal.innerHTML = `
    <div style="
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.7);
      display:flex;
      justify-content:center;
      align-items:center;
      z-index:99999;
    ">
      <div style="
        background:#fff;
        width:420px;
        padding:20px;
        border-radius:12px;
      ">
        <h3>⚠️ Cierre con evidencia obligatoria</h3>

        <p style="font-size:13px;color:#555">
          Debes subir una foto o video para poder cerrar este reporte.
        </p>

        <input type="file"
          id="evidenciaFile"
          accept="image/*,video/*"
          style="width:100%;margin:10px 0;"
        >

        <div id="previewEvidencia" style="margin:10px 0;"></div>

        <div style="display:flex;justify-content:flex-end;gap:10px;">
          <button id="cancelarEvidencia">Cancelar</button>
          <button id="guardarEvidencia">Cerrar con evidencia</button>
        </div>
      </div>
    </div>
  `;

  document.body.appendChild(modal);

  // PREVIEW
  document.getElementById("evidenciaFile").onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;

    const reader = new FileReader();
    reader.onload = ev => {

      if(file.type.startsWith("image/")){
        document.getElementById("previewEvidencia").innerHTML =
          `<img src="${ev.target.result}" style="max-width:100%;border-radius:10px;">`;
      } else {
        document.getElementById("previewEvidencia").innerHTML =
          `<video controls style="max-width:100%;border-radius:10px;">
            <source src="${ev.target.result}">
          </video>`;
      }
    };

    reader.readAsDataURL(file);
  };

  // CANCELAR → regresa estado original
  document.getElementById("cancelarEvidencia").onclick = () => {
    modal.remove();
    select.value = estadoAnterior; // 🔥 revierte cambio
  };

  // GUARDAR
  document.getElementById("guardarEvidencia").onclick = async () => {

    const file = document.getElementById("evidenciaFile").files[0];

    if(!file){
      alert("Debes subir evidencia para cerrar");
      return;
    }

    const base64 = await new Promise(res=>{
      const reader = new FileReader();
      reader.onload = e => res(e.target.result);
      reader.readAsDataURL(file);
    });

    const { error } = await supabaseClient
      .from("reclamos")
      .update({
        estado: "cerrado",
        foto_evidencia: base64
      })
      .eq("id", id);

    if(error){
      alert(error.message);
      return;
    }

    modal.remove();
    cargar();
  };
}

async function cambiarEstado(id){

  console.log("CLICK ID:", id);

  const { data: row, error } = await supabaseClient
    .from("reclamos")
    .select("*")
    .eq("id", id)
    .single();

  if(error || !row){
    console.log(error);
    alert("No se encontró el registro");
    return;
  }

  const estados = ["abierto","proceso","cerrado"];
  const idx = estados.indexOf(row.estado || "abierto");
  const nuevo = estados[(idx + 1) % estados.length];

  // SI ES CERRADO → MODAL
if(nuevo === "cerrado"){
  abrirModalCierre(id); // ✔ ESTA ES LA CORRECTA EN TU CÓDIGO
  return;
}

  const { error: err2 } = await supabaseClient
    .from("reclamos")
    .update({ estado: nuevo })
    .eq("id", id);

  if(err2){
    console.log(err2);
    alert(err2.message);
    return;
  }

  cargar();
}
async function guardarCierre(id){

  const file = document.getElementById("fileCierre").files[0];

  let evidencia = null;

  // SI hay archivo, lo convierte a base64
  if(file){
    evidencia = await new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.readAsDataURL(file);
    });
  }

  const { error } = await supabaseClient
    .from("reclamos")
    .update({
      estado: "cerrado",
      foto_evidencia: evidencia // puede ser null si no suben nada
    })
    .eq("id", id);

  if(error){
    alert(error.message);
    return;
  }

  // cerrar modal
  document.getElementById("modalCierre")?.remove();

  // recargar tabla
  cargar();

  // mensaje final
  alert("Reporte Cerrado");
}
function previewArchivo(input){

  const file = input.files[0];
  if(!file) return;

  const reader = new FileReader();

  reader.onload = e => {

    const cont = document.getElementById("previewContainer");

    if(file.type.startsWith("image/")){
      cont.innerHTML = `<img src="${e.target.result}" style="max-width:100%;border-radius:10px;">`;
    } else {
      cont.innerHTML = `
        <video controls style="max-width:100%;border-radius:10px;">
          <source src="${e.target.result}">
        </video>
      `;
    }
  };

  reader.readAsDataURL(file);
}
function previewFoto(input){

  const file = input.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = e => {

    const img = document.getElementById("previewEvidencia");

    img.src = e.target.result;
    img.style.display = "block";
  };

  reader.readAsDataURL(file);
}
